name: Update Stats

on:
  # Run daily at 12:00 AM Rwanda time (UTC+2 → 22:00 UTC)
  schedule:
    - cron: '0 22 * * *'

  # Allow manual trigger (run ASAP)
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    # Needed so the built-in token can push the generated cards back to the repo.
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Stats Images
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # The default GITHUB_TOKEN hits GitHub's GraphQL "Resource limits for this
          # query exceeded" error and 403s on the account-wide stats endpoints.
          # Use a Personal Access Token stored as the SUMMARY_GITHUB_TOKEN secret
          # (classic PAT with `public_repo` + `read:user`). Falls back to the
          # built-in token if the secret is not set.
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          # Let the dedicated commit step below push, so it uses our commit message.
          AUTO_PUSH: false

      - name: Commit & Push if changed
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes to commit"
            exit 0
          fi

          git add profile-summary-card-output
          git commit -m "chore: update profile stats cards"
          git push
